plugins {
    alias(libs.plugins.androidLibrary)
    alias(libs.plugins.jetbrainsKotlinAndroid)
    id 'maven-publish'
}

android {
    namespace 'com.siasun.dianshi'
    compileSdk 34

    defaultConfig {
        minSdk 25

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
        dataBinding = true
        viewBinding = true
    }
}

dependencies {
    api fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation libs.androidx.core.ktx
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    api(libs.snakeYaml)
    api(libs.shapeView)
    api(libs.shapeDrawable)
    api(libs.liveEventBus.core)
    api(libs.liveEventBus.gson)
    api(libs.glide.core)
    api(libs.commons)
    api(libs.fastjson)

}

// JitPack 发布：提供 publishToMavenLocal 任务，输出 dslibrary 的 AAR
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                // groupId / artifactId / version 由 JitPack 依据仓库信息自动填充
            }
        }
    }
}
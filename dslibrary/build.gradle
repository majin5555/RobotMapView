plugins {
    alias(libs.plugins.androidLibrary)
    alias(libs.plugins.jetbrainsKotlinAndroid)
    id 'maven-publish'
}

android {
    namespace 'com.siasun.dianshi'
    compileSdk 34

    defaultConfig {
        minSdk 25

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        consumerProguardFiles "consumer-rules.pro"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }

    buildFeatures {
        buildConfig true
        dataBinding = true
        viewBinding = true
    }

    // AGP 7.1+ 发布 aar 必须显式声明要发布的 variant（JitPack 需要）
    publishing {
        singleVariant('release')
    }
}

// JitPack 检测到 maven-publish 后会执行 publishToMavenLocal，
// 并从 ~/.m2 收集 aar + pom（pom 中带有 api 传递依赖）
afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = project.findProperty('GROUP') ?: 'com.github.siasun'
                artifactId = project.findProperty('POM_ARTIFACT_ID') ?: 'dslibrary'
                version = project.findProperty('VERSION') ?: '1.0.0'
            }
        }
    }
}

dependencies {
    api fileTree(include: ['*.jar', '*.aar'], dir: 'libs')
    implementation libs.androidx.core.ktx
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.androidx.junit
    androidTestImplementation libs.androidx.espresso.core

    api(libs.snakeYaml)
    api(libs.shapeView)
    api(libs.shapeDrawable)
    api(libs.liveEventBus.core)
    api(libs.liveEventBus.gson)
    api(libs.glide.core)
    api(libs.commons)
    api(libs.fastjson)

}